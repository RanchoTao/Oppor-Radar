language: zh-CN

timezone: Asia/Shanghai

interests:
  - 北京及周边高校、研究院可参加的讲座、Workshop、科研活动与招募
  - 全国或线上可参加的 AI Hackathon、算法竞赛、开源挑战与开发者活动
  - 本科生科研招募、RA、研究实习、训练营、暑校与交流机会
  - Frontier AI / AGI
  - AI Agent 与长期任务
  - 强化学习与后训练
  - 大模型推理与可解释性
  - AI for Mathematics / Lean / 自动证明
  - 机器学习前沿论文与顶会趋势
  - 科研方法、科研自动化与研究工具
  - Research Internship / Summer School / Workshop / CFP
  - ML Systems / GPU / 推理与训练基础设施
  - 高价值开源项目与开发者工具
  - AI 公司战略、算力与半导体产业
  - 宏观经济与会显著影响科技发展的政策
  - 重大国际事件与全球科技政策

high_priority_signals:
  - 未来 45 天内可以真实报名、申请、投稿、参赛或到场的机会，尤其是北京线下与全国线上机会
  - 明确面向本科生、学生、个人开发者或开放报名的科研与工程机会
  - 高校、研究院、AI 社区和企业举办的 Hackathon、竞赛、Workshop、Meetup、科研招募与实习
  - Frontier lab 发布新模型、关键研究结果或重大能力变化
  - Agent、RL、Reasoning、Interpretability 出现新的方法或范式变化
  - AI for Mathematics 出现研究级数学成果、自动证明或形式化进展
  - ICLR / ICML / NeurIPS 等顶会出现重要方法、趋势、截止或规则变化
  - 与当前研究方向高度相关且值得认真阅读的新论文
  - 本科生可申请的研究实习、暑校、workshop、fellowship、travel grant 或 CFP
  - 能显著降低研究与工程成本的新框架、GPU、推理或训练基础设施
  - AI 产业资本开支、芯片、公司战略发生结构性变化
  - AI / 半导体 / 科研相关政策出现会改变长期判断的重要变化

low_priority_signals:
  - 与当前资格明显不匹配的海外资深岗位、Research Manager 或高级 Research Scientist 招聘
  - 只能了解、短期内无法参与且没有明显认知价值的远端机会
  - 重复转载和二手改写
  - 纯宣传、营销软文和标题党
  - 导航页、师资页、机构简介、常规活动回顾
  - 没有新事实的观点文章
  - 普通产品小更新和低影响版本迭代
  - 与长期目标无明显关系的日常市场波动
  - 为了填满版面而加入的低价值内容

newspaper_sections:
  - 今日总览
  - 机会雷达
  - 科研前沿
  - AI Frontier
  - 数学 × AI
  - Engineering
  - AI 商业 / 产业
  - 世界状态

editorial_preferences:
  max_daily_highlights: 28
  max_editor_input_items: 64
  prefer_primary_sources: true
  explain_why_it_matters: true
  surface_cross_group_signals: true
  prefer_actionable_opportunities: true
  home_region: 北京
  opportunity_horizon_days: 45
  allow_empty_sections: true
  front_page_max_items: 7
  section_max_items: 5
  daily_reading_budget_chars: 3600
  edition_turnover_hour: 8
