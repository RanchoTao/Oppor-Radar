name: Opportunity Radar Daily

on:
  schedule:
    # 08:23 Beijing (00:23 UTC). Off the top of the hour on purpose: GitHub delays
    # top-of-hour cron jobs heavily; the old "0 0 * * *" usually ran around noon.
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with refresh.yml: only one job may read/modify the database at a time.
concurrency:
  group: oppor-radar-data
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore database
        run: bash scripts/db_store.sh restore
      - name: Run daily job
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          OR_EMAIL_ENABLED: "true"
          OR_EMAIL_TO: ${{ secrets.OR_EMAIL_TO }}
          OR_SMTP_USERNAME: ${{ secrets.OR_SMTP_USERNAME }}
          OR_SMTP_PASSWORD: ${{ secrets.OR_SMTP_PASSWORD }}
          OR_PUBLIC_URL: https://ranchotao.com/Oppor-Radar/
        run: python -m src.scheduler.run_daily
      - name: Save database
        run: bash scripts/db_store.sh save
      - name: Build GitHub Pages data
        run: python scripts/build_site_data.py
      - name: Commit generated report
        run: |
          git add data/reports docs/data
          git diff --cached --quiet && exit 0
          git commit -m "chore: update daily intelligence brief"
          git pull --rebase origin main
          git push origin HEAD:main
