name: Refresh OR Morning

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "scripts/build_site_data.py"
      - "scripts/db_store.sh"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with daily.yml: only one job may read/modify the database at a time.
concurrency:
  group: oppor-radar-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore database
        run: bash scripts/db_store.sh restore
      - name: Generate current edition
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
        run: python -m src.scheduler.run_daily
      - name: Save database
        run: bash scripts/db_store.sh save
      - name: Build GitHub Pages data
        run: python scripts/build_site_data.py
      - name: Commit fresh edition
        run: |
          git add data/reports docs/data
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh OR Morning edition"
          git pull --rebase origin main
          git push origin HEAD:main
