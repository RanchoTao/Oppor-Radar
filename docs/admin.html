<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Opportunity Radar · Registry</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">OR<span>Opportunity Radar</span></a>
    <nav><a href="./">返回日报</a><a href="https://github.com/RanchoTao/Oppor-Radar">GitHub</a></nav>
  </header>

  <main class="admin-main">
    <section class="admin-hero">
      <p class="eyebrow">SOURCE REGISTRY ADMIN</p>
      <h1>管理你的信息边界。</h1>
      <p class="section-copy">这里不是浏览器本地草稿。连接 Registry API 后，保存操作会直接写回仓库配置，下一次 Daily 将按新来源运行。</p>
    </section>

    <section class="admin-connect surface-card">
      <div>
        <h2>连接管理服务</h2>
        <p id="registry-endpoint" class="muted">正在读取运行配置…</p>
      </div>
      <div class="admin-token-row">
        <label>Admin Token<input id="admin-token" type="password" autocomplete="current-password" placeholder="仅用于本次页面会话" /></label>
        <button id="connect-registry" class="button primary" type="button">连接</button>
      </div>
      <p id="admin-message" class="admin-message"></p>
    </section>

    <section id="registry-editor" class="admin-editor hidden">
      <div class="admin-columns">
        <section class="surface-card">
          <div class="admin-section-heading"><div><p class="eyebrow">GROUPS</p><h2>分组</h2></div></div>
          <form id="add-group-form" class="inline-form">
            <input id="new-group-name" required placeholder="例如：金融" />
            <button class="button ghost" type="submit">添加</button>
          </form>
          <div id="admin-groups" class="admin-list"></div>
        </section>

        <section class="surface-card">
          <div class="admin-section-heading"><div><p class="eyebrow">SOURCES</p><h2>信息源</h2></div><span id="admin-source-count" class="muted"></span></div>
          <form id="add-source-form" class="admin-source-form">
            <label>名称<input id="new-source-name" required placeholder="例如：Federal Reserve" /></label>
            <label>URL<input id="new-source-url" type="url" required placeholder="https://example.com/" /></label>
            <label>分组<select id="new-source-group"></select></label>
            <label>关注关键词<input id="new-source-watch" placeholder="例如：rate, inflation, FOMC" /></label>
            <label>标签<input id="new-source-tags" placeholder="例如：宏观, 官方" /></label>
            <button class="button ghost" type="submit">加入列表</button>
          </form>
          <div id="admin-sources" class="admin-list source-admin-list"></div>
        </section>
      </div>

      <div class="admin-savebar surface-card">
        <div><strong>尚未保存的修改只存在当前页面内存。</strong><p class="muted">点击保存后才会写入 GitHub main 配置。</p></div>
        <button id="save-registry" class="button primary" type="button">保存到 Registry</button>
      </div>
    </section>
  </main>

  <script src="./admin.js"></script>
</body>
</html>
