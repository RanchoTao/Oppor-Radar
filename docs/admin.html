<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Opportunity Radar · Registry</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./admin.css" />
  <link rel="icon" href="data:," />
</head>
<body>
  <a class="skip-link" href="#admin-main">跳至管理服务</a>
  <header class="topbar">
    <a class="brand" href="./">OR<span>Opportunity Radar</span></a>
    <nav aria-label="主导航"><a href="./#newspaper">时报</a><a href="./#reports">日报</a><a href="./#sources">信息源</a><a href="./#settings">设置</a></nav>
  </header>

  <main id="admin-main" class="admin-main" tabindex="-1">
    <section class="admin-hero">
      <p class="eyebrow">SOURCE REGISTRY ADMIN</p>
      <h1>选择你观察世界的窗口。</h1>
      <p class="section-copy">管理分组与来源。保存后会更新 GitHub 仓库配置，下一次日报将按新来源运行。</p>
    </section>

    <section class="admin-connect surface-card">
      <div>
        <h2>连接管理服务</h2>
        <p id="registry-endpoint" class="muted">正在读取运行配置…</p>
      </div>
      <div class="admin-token-row">
        <label>Admin Token<input id="admin-token" type="password" autocomplete="off" placeholder="仅用于本次页面会话" disabled /></label>
        <button id="connect-registry" class="button primary" type="button" disabled>连接</button>
        <button id="disconnect-registry" class="button hidden" type="button">断开连接</button>
      </div>
      <p id="admin-message" class="admin-message" role="status" aria-live="polite"></p>
    </section>

    <section id="registry-editor" class="admin-editor hidden">
      <div class="admin-columns">
        <section class="surface-card">
          <div class="admin-section-heading"><div><p class="eyebrow">GROUPS</p><h2>分组</h2></div></div>
          <form id="add-group-form" class="inline-form">
            <input id="new-group-name" required aria-label="新分组名称" placeholder="例如：金融" />
            <button class="button ghost" type="submit">添加</button>
          </form>
          <div id="admin-groups" class="admin-list"></div>
        </section>

        <section class="surface-card">
          <div class="admin-section-heading"><div><p class="eyebrow">SOURCES</p><h2>信息源</h2></div><span id="admin-source-count" class="muted"></span></div>
          <form id="add-source-form" class="admin-source-form">
            <label>名称<input id="new-source-name" required placeholder="例如：Federal Reserve" /></label>
            <label>URL<input id="new-source-url" type="url" required placeholder="https://example.com/" /></label>
            <label>分组<select id="new-source-group"></select></label>
            <label>关注关键词<input id="new-source-watch" placeholder="例如：rate, inflation, FOMC" /></label>
            <label>标签<input id="new-source-tags" placeholder="例如：宏观, 官方" /></label>
            <button class="button ghost" type="submit">加入列表</button>
          </form>
          <div id="admin-sources" class="admin-list source-admin-list"></div>
        </section>
      </div>

      <div class="admin-savebar surface-card">
        <div><strong id="save-state" role="status">没有未保存的修改。</strong><p class="muted">保存将写入 GitHub main 配置。</p></div>
        <div class="save-actions"><button id="discard-changes" class="button" type="button" disabled>撤销修改</button><button id="save-registry" class="button primary" type="button" disabled>保存到 Registry</button></div>
      </div>
    </section>
  </main>
  <footer><span>OR MORNING / Source Registry</span><a href="./">返回阅读 ↗</a></footer>

  <script src="./admin.js"></script>
</body>
</html>
